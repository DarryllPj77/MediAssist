# MediAssist CI (M3.3): build, unit and workflow tests, then the browser page checks.
# Fictional data only; the browser tests start the app with a throwaway database.
name: CI

on:
  push:
    branches: [main, design/premium-civic-imagery]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MediAssist.slnx

      - name: Build
        run: dotnet build MediAssist.slnx --configuration Release --no-restore

      - name: Unit and workflow tests
        run: dotnet test tests/MediAssist.Web.Tests --configuration Release --no-build --logger "trx;LogFileName=unit.trx"

      - name: Install Chromium for the browser tests
        run: pwsh tests/MediAssist.Web.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Browser page checks
        run: dotnet test tests/MediAssist.Web.E2E --configuration Release --no-build --logger "trx;LogFileName=e2e.trx"

      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore
